; EGroupware performance monitoring for the PHP-FPM pool "www"
;
; Mounted as /etc/php/<version>/fpm/pool.d/zz-egw-monitor.conf: FPM merges a
; repeated [www] section into the already defined pool, so the image's
; www.conf stays untouched.
;
; Overhead: one write() per request for the access log; the slowlog only acts
; on requests already slower than request_slowlog_timeout (the master pauses
; that worker for a few ms to read its stack). The status page is served on a
; separate localhost-only socket and is only read once a minute by the sampler.
[www]

; one line per request: start time, worker pid (to match slowlog entries),
; method, HTTP status, duration in ms, peak memory in KB, CPU % of the request
; and the request URI (incl. query)
access.log = /var/log/egw-monitor/fpm-access.log
access.format = "%{%Y-%m-%dT%H:%M:%S%z}t %p %m %s %{mili}d %{kilo}M %C %{REQUEST_URI}e"

; PHP backtrace of every request running longer than 3s
; (needs the SYS_PTRACE capability inside Docker, see docker-compose.monitoring.yml)
slowlog = /var/log/egw-monitor/fpm-slow.log
request_slowlog_timeout = 3s
request_slowlog_trace_depth = 40

; pool status (busy/idle workers, listen queue, max children reached),
; only reachable from inside the container on 127.0.0.1:9001
pm.status_path = /fpm-status
pm.status_listen = 127.0.0.1:9001
